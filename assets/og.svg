  <!-- copy (RTL, right aligned) -->
  <g direction="rtl" text-anchor="start">
    <text x="1100" y="250" font-family="Baloo Bhaijaan 2, Noto Kufi Arabic, Geeza Pro, Tahoma, sans-serif"
